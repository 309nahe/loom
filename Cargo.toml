[workspace]
resolver = "3"
members = [
    "crates/loom-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["309nahe"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }

# Serialization & Hashing
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Concurrency & Graph
petgraph = { version = "0.6", features = ["serde-1"] }
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
